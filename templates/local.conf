MACHINE = "raspberrypi0"
DISTRO = "poky"

ENABLE_UART = "1"

DISTRO_FEATURES:append = " virtualization "
DISTRO_FEATURES:append = " systemd "
DISTRO_FEATURES:append = " usrmerge "
DISTRO_FEATURES:remove = " sysvinit "
VIRTUAL-RUNTIME_init_manager = "systemd"
VIRTUAL-RUNTIME_initscripts = ""
IMAGE_INSTALL:append = " docker docker-compose "
IMAGE_INSTALL:append = " e2fsprogs-resize2fs util-linux parted "

PACKAGE_CLASSES = "package_deb"
PACKAGE_FEED_URIS ="http://<local-machine-ip>:5678"
EXTRA_IMAGE_FEATURES += " debug-tweaks package-management "

ENABLE_I2C = "1"
KERNEL_MODULE_AUTOLOAD:rpi += "i2c-dev"

LICENSE_FLAGS_ACCEPTED += "synaptics-killswitch"

RPI_EXTRA_CONFIG:append = "\n\
dtparam=spi=on\n\
enable_uart=1\n\
dtparam=i2c_arm=on\n\
dtoverlay=w5500,int_pin=12,reset_pin=17\n\
dtoverlay=pwm\n\
dtoverlay=spi1-1cs,cs0_pin=16\n\
dtoverlay=bq32000\n\
"

RPI_KERNEL_DEVICETREE_OVERLAYS:append = " overlays/w5500.dtbo overlays/pwm.dtbo overlays/spi1-1cs.dtbo "
